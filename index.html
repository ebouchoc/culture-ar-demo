<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
<a-assets>
  <img id="lightbulbImage" src="./lightbulb.png">
  <img id="noBulbBackground" src="./culture-no-bulb.png">
</a-assets>
    <a-camera
  position="0 0 0"
  look-controls="enabled: false">
  
  <a-cursor
    raycaster="objects: .clickable"
    fuse="false">
  </a-cursor>

</a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
<a-image
  id="replacementBackground"
  src="#noBulbBackground"
  position="0 0 0.02"
  width="1"
  height="0.5625"
  visible="false">
</a-image>
      <a-image
          id="animatedBulb"
          src="#lightbulbImage"
          position="0.34 0.10 0.08"
          width="0.27"
          height="0.27"
          material="transparent: true; alphaTest: 0.01"
          visible="false">
      </a-image>
      <a-entity id="lightbulbHotspot"
          geometry="primitive: plane; width: 0.34; height: 0.50"
          material="opacity: 0; transparent: true"
          position="0.34 0.10 0.05"
          class="clickable">
      </a-entity>

      <a-text
          id="lightbulbText"
          value="Create What's Next"
          align="center"
          color="#FFFFFF"
          width="1.4"
          position="0.34 0.10 0.12"
          visible="false">
      </a-text>

    </a-entity>

  </a-scene>
<script>
  const hotspot = document.querySelector('#lightbulbHotspot');
  const text = document.querySelector('#lightbulbText');
  const background = document.querySelector('#replacementBackground');
  const bulb = document.querySelector('#animatedBulb');

  window.addEventListener('touchend', (event) => {
    const touch = event.changedTouches[0];

    const camera = document.querySelector('a-camera').getObject3D('camera');
    const hotspotObject = hotspot.object3D;

    const position = new THREE.Vector3();
    hotspotObject.getWorldPosition(position);
    position.project(camera);

    const screenX = (position.x + 1) / 2 * window.innerWidth;
    const screenY = (-position.y + 1) / 2 * window.innerHeight;

    const distance = Math.hypot(
      touch.clientX - screenX,
      touch.clientY - screenY
    );

    if (distance < 100) {
      background.setAttribute('visible', true);
      bulb.setAttribute('visible', true);
      text.setAttribute('visible', true);

      bulb.setAttribute('animation__float', {
        property: 'position',
        to: '0.34 0.10 0.30',
        dur: 700,
        easing: 'easeOutQuad'
      });

      bulb.setAttribute('animation__pulse', {
        property: 'scale',
        from: '1 1 1',
        to: '1.18 1.18 1.18',
        dir: 'alternate',
        loop: true,
        dur: 900,
        easing: 'easeInOutSine'
      });
    }
  });
</script>

 <div id="rotateMessage">
  Rotate your phone to continue
</div> 
  
<div id="fullExperience">
  <img src="./culture-experience.png" id="fullBackground">
</div>

<style>
  #fullExperience {
    display: none;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(
  90deg,
  #16084f 0%,
  #24105c 50%,
  #d8321c 100%
);
    z-index: 9999;
    overflow: hidden;
  }

  #fullBackground {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  #rotateMessage {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: black;
  color: white;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: Arial, sans-serif;
  font-size: 28px;
  padding: 30px;
}

@media (orientation: portrait) {
  #fullExperience {
    display: none !important;
  }

  #rotateMessage {
    display: flex;
  }
}
</style>
<script>
  const target = document.querySelector('[mindar-image-target]');
  const fullExperience = document.querySelector('#fullExperience');

  target.addEventListener('targetFound', () => {
    fullExperience.style.display = 'block';
  });
</script>
</body>
</html>
