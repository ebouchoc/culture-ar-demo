<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
  position="0 0 0"
  look-controls="enabled: false"
  cursor="rayOrigin: mouse"
  raycaster="objects: .clickable">
</a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-entity id="lightbulbHotspot"
          geometry="primitive: plane; width: 0.34; height: 0.50"
          material="color: #FF00FF; opacity: 0.45; transparent: true"
          position="0.34 0.10 0.05"
          class="clickable">
      </a-entity>

      <a-text
          id="lightbulbText"
          value="Create What's Next"
          align="center"
          color="#FFFFFF"
          width="1.4"
          position="0.34 0.10 0.12"
          visible="false">
      </a-text>

    </a-entity>

  </a-scene>
<script>
  const hotspot = document.querySelector('#lightbulbHotspot');
  const text = document.querySelector('#lightbulbText');

  hotspot.addEventListener('click', () => {
    text.setAttribute('visible', true);
  });
</script>
</body>
</html>
